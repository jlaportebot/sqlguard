[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlguard"
version = "0.1.0"
description = "Schema validation, migration generation, and query safety for Python SQL projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "jlaportebot" }]
keywords = ["sql", "schema", "migration", "validation", "linting", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
sqlguard = "sqlguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
